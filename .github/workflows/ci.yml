# Verificações automáticas: rodam em todo envio para main, desenvolvimento e producao e em todo
# pull request. Uma mudança só deve ser juntada com as duas tarefas em verde.
name: Verificações

on:
  push:
    branches: [main, desenvolvimento, producao]
  pull_request:

permissions:
  contents: read

# Um envio novo no mesmo ramo cancela a verificação do anterior, que ficou velha.
concurrency:
  group: verificacoes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api-sgcas
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sgcas
          POSTGRES_PASSWORD: sgcas_ci
          POSTGRES_DB: sgcas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgcas -d sgcas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      DATABASE_URL: postgresql://sgcas:sgcas_ci@127.0.0.1:5432/sgcas
      PII_ENCRYPTION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api-sgcas/requirements.txt
            api-sgcas/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Chaves só desta verificação
        # Geradas na hora e descartadas no fim: nenhum segredo real passa pelo CI.
        run: >-
          python -c "import base64, os, secrets;
          print('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(64));
          print('PII_ENCRYPTION_KEY=' + base64.b64encode(os.urandom(32)).decode());
          print('PII_HMAC_KEY=' + base64.b64encode(os.urandom(32)).decode())"
          >> "$GITHUB_ENV"

      - name: Lint (ruff)
        run: ruff check .

      - name: Configuração do Django
        run: python manage.py check

      - name: Migrations em dia com os modelos
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: python manage.py test testes --noinput

  front:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: front-sgcas
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front-sgcas/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Dependências de produção sem falha de segurança conhecida
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: Testes de navegador
        run: npm run test:e2e

      - name: Relatório dos testes de navegador
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: front-sgcas/playwright-report/
          retention-days: 14
