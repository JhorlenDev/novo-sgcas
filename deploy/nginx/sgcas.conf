# SGCAS — nginx na frente do Next.js (produção)
#
#   navegador ──HTTPS──▶ nginx ──HTTP──▶ Next.js (127.0.0.1:3000) ──▶ API (127.0.0.1:8000)
#
# Como usar:
#   1. Troque `sgcas.exemplo.gov.br` pelo domínio real (3 lugares) e confira o
#      caminho dos certificados.
#   2. Copie para /etc/nginx/conf.d/sgcas.conf, rode `nginx -t` e `nginx -s reload`.
#   3. Na API, mantenha TRUSTED_PROXIES=1 (um proxy reverso: este nginx).
#
# Pré-requisitos, sem os quais esta configuração não protege o que promete:
#   - o Next escuta só no loopback:  npm run start -- -H 127.0.0.1
#   - a API escuta só no loopback (o docker-compose.yml já faz isso)
# Quem alcança o Next ou a API sem passar por aqui escreve o X-Forwarded-For
# inteiro e se passa por qualquer IP — no limite de requisições e na auditoria.

upstream sgcas_front {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP: só redireciona para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name sgcas.exemplo.gov.br;

    # Descomente para renovar certificados Let's Encrypt (http-01) sem derrubar o site.
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 é opcional: nginx >= 1.25.1 usa `http2 on;`; versões anteriores,
    # `listen 443 ssl http2;`. Fica de fora para a configuração valer em ambas.
    server_name sgcas.exemplo.gov.br;

    ssl_certificate     /etc/letsencrypt/live/sgcas.exemplo.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgcas.exemplo.gov.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # Anexos do prontuário aceitam até 25 MB (apps/cidadaos/anexos.py), e o
    # corpo multipart é um pouco maior que o arquivo. O padrão do nginx é 1 MB:
    # sem esta linha todo envio maior volta 413 antes de chegar à API.
    client_max_body_size 26m;

    # Os cabeçalhos de segurança (HSTS, CSP, X-Frame-Options...) já são enviados
    # pelo Next; repeti-los aqui os duplicaria.

    location / {
        proxy_pass http://sgcas_front;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O IP do cliente. SUBSTITUI o cabeçalho (não acrescenta): este nginx é a
        # borda, então o que o cliente enviou em X-Forwarded-For é descartado e
        # só vale o endereço que o nginx viu conectar. Com `$proxy_add_x_forwarded_for`
        # o valor forjado pelo cliente seguiria junto, e só o TRUSTED_PROXIES
        # certo da API impediria o estrago.
        #
        # Se houver um balanceador/CDN ANTES deste nginx, ele é quem vê o IP real:
        # configure `set_real_ip_from <ip do balanceador>; real_ip_header
        # X-Forwarded-For;` e ajuste TRUSTED_PROXIES na API para 2.
        proxy_set_header X-Forwarded-For $remote_addr;

        # O gunicorn da API aceita requisições de até 120 s (Dockerfile).
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
