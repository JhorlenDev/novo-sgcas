services:
  postgres:
    image: postgres:16-alpine
    container_name: api-sgcas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgcas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-sgcas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sgcas} -d ${POSTGRES_DB:-sgcas}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api-sgcas
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgcas}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-sgcas}
    ports:
      - '${API_PORT:-8000}:8000'
    volumes:
      - ./armazenamento:/app/armazenamento
    healthcheck:
      # Só HTTP 200 vale: `curl -f` aceita redirecionamento como sucesso. Consulta
      # /api/health, que confere o banco e não depende de login, de ALLOWED_HOSTS
      # nem do redirecionamento HTTPS (ver apps/comum/saude.py). Endereço IPv4
      # explícito porque o gunicorn escuta em 0.0.0.0, não em ::1.
      test:
        - CMD-SHELL
        - 'test "$$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health)" = 200'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
